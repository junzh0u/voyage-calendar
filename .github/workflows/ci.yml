name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check voyage-calendar
      - run: ./voyage-calendar --test
        env:
          # Use the runner's Google Chrome; its Chromium crashes during rendering.
          VOYAGE_CALENDAR_CHROME: google-chrome
